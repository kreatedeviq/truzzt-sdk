name: niv2fa_flutter
description: NIV2FA Network Identity verification plugin (SIM1/SIM2 match on Android; in-app verify WebView on iOS)
version: 1.0.0
homepage: https://jeebly.kreateiq.com/niv2fa/docs/sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.niv2fa.flutter
        pluginClass: Niv2faFlutterPlugin
      ios:
        pluginClass: Niv2faFlutterPlugin

dependencies:
  flutter:
    sdk: flutter
