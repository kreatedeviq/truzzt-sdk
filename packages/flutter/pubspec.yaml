name: truzzt_flutter
description: Truzzt Network Identity verification plugin (SIM1/SIM2 match on Android; in-app verify WebView on iOS)
version: 1.0.0
homepage: https://truzzt.site/docs/sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.truzzt.flutter
        pluginClass: TruzztFlutterPlugin
      ios:
        pluginClass: TruzztFlutterPlugin

dependencies:
  flutter:
    sdk: flutter
